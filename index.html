<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>How CCAT Sprint Was Built</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#0f141d;--panel2:#141b26;--text:#f4f7fb;--muted:#a9b4c4;--line:#2a3444;--accent:#86f0c2;--accent2:#8ab4ff;--warn:#ffd37a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,rgba(138,180,255,.12),transparent 28rem),radial-gradient(circle at 85% 20%,rgba(134,240,194,.08),transparent 30rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px}.app{max-width:1240px;margin:auto}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--accent);font-weight:800}h1{font-size:clamp(2rem,4vw,4.5rem);line-height:.95;margin:.4rem 0 0;max-width:850px;letter-spacing:-.055em}.sub{max-width:620px;color:var(--muted);font-size:1rem;line-height:1.55}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:10px 15px;font:inherit;font-weight:750;cursor:pointer;min-height:44px}button:hover,button:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(134,240,194,.15)}button.primary{background:var(--accent);color:#06100c;border-color:transparent}button[aria-pressed="true"]{background:var(--accent2);color:#07101e;border-color:transparent}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.65fr);gap:18px}.card{background:linear-gradient(180deg,rgba(20,27,38,.94),rgba(12,17,25,.94));border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 70px rgba(0,0,0,.34)}.viz{min-height:630px;padding:14px;position:relative;overflow:hidden}svg{display:block;width:100%;height:auto;min-height:600px}.sidebar{padding:22px;display:flex;flex-direction:column;gap:20px}.step{font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.09em;text-transform:uppercase}.sidebar h2{margin:0;font-size:clamp(1.45rem,2.5vw,2.2rem);letter-spacing:-.035em}.sidebar p{margin:0;color:var(--muted);line-height:1.6}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:14px;border-radius:15px;background:var(--panel2);border:1px solid var(--line)}.metric strong{font-size:1.55rem;display:block}.metric span{font-size:.78rem;color:var(--muted)}.timeline{display:flex;gap:6px}.timeline button{padding:0;width:100%;height:44px;min-height:44px;border-radius:99px;border:0;background:transparent;position:relative}.timeline button::after{content:"";position:absolute;left:0;right:0;top:18px;height:8px;border-radius:99px;background:#263140}.timeline button.active::after{background:var(--accent)}.note{border-left:3px solid var(--warn);padding:10px 0 10px 14px;color:var(--muted);font-size:.88rem}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);padding:0 8px 12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:860px){body{padding:14px}header{display:block}.layout{grid-template-columns:1fr}.viz{min-height:500px}svg{min-height:470px}.sidebar{order:-1}.sub{margin-top:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header><div><div class="eyebrow">Animated build explainer</div><h1>How CCAT Sprint became a faithful practice engine</h1></div><p class="sub">A D3 narrative of the research, calibration, item design, exam engine, and quality-assurance loop behind the app.</p></header>
<div class="controls" aria-label="Animation controls"><button class="primary" id="play">Play</button><button id="prev">Previous</button><button id="next">Next</button><button id="motion" aria-pressed="false">Reduced motion</button><button id="replay">Replay scene</button></div>
<section class="layout"><div class="card viz"><svg id="chart" role="img" aria-labelledby="chart-title chart-desc"></svg><div class="legend"><span><i class="dot" style="background:var(--accent)"></i>validated output</span><span><i class="dot" style="background:var(--accent2)"></i>source or system</span><span><i class="dot" style="background:var(--warn)"></i>calibration constraint</span></div></div><aside class="card sidebar" aria-live="polite"><div><div class="step" id="step-label">Step 1 of 6</div><h2 id="scene-title"></h2></div><p id="scene-body"></p><div class="metric-grid" id="metrics"></div><div class="note" id="scene-note"></div><div class="timeline" id="timeline" aria-label="Story steps"></div></aside></section><p id="chart-desc" class="sr-only"></p>
</main>
<script>
const scenes=[
{title:"1. Define the authentic test envelope",body:"The build started with the published CCAT constraints: 50 questions, 15 minutes, five answer choices, no calculator, no wrong-answer penalty, and a mix of verbal, math-and-logic, and spatial reasoning.",note:"The target was structural fidelity—not copying proprietary questions.",metrics:[["50","questions"],["15:00","time limit"],["5","choices"],["3","domains"]],nodes:[{id:"criteria",label:"Official format",type:"source",x:.18,y:.28},{id:"crossover",label:"Crossover guidance",type:"source",x:.18,y:.68},{id:"blueprint",label:"CCAT blueprint",type:"output",x:.68,y:.48}],links:[["criteria","blueprint"],["crossover","blueprint"]]},
{title:"2. Convert the blueprint into an item taxonomy",body:"Each domain was decomposed into the actual cognitive operations a candidate must perform quickly: analogies, vocabulary, arithmetic, rates, syllogisms, rotations, matrices, folding, sequences, and outliers.",note:"This prevents a fake practice test from becoming merely a pile of generic aptitude questions.",metrics:[["10+","item families"],["3","domains"],["18 sec","nominal pace"],["1","shared blueprint"]],nodes:[{id:"blueprint",label:"CCAT blueprint",type:"source",x:.12,y:.5},{id:"verbal",label:"Verbal",type:"constraint",x:.48,y:.18},{id:"logic",label:"Math + logic",type:"constraint",x:.48,y:.5},{id:"spatial",label:"Spatial",type:"constraint",x:.48,y:.82},{id:"taxonomy",label:"Item taxonomy",type:"output",x:.82,y:.5}],links:[["blueprint","verbal"],["blueprint","logic"],["blueprint","spatial"],["verbal","taxonomy"],["logic","taxonomy"],["spatial","taxonomy"]]},
{title:"3. Write original items with realistic distractors",body:"Questions were authored to match the test’s fast mental workload. Distractors were designed from likely mistakes—reversed ratios, incomplete rotations, invalid syllogistic conclusions, or one-step arithmetic slips.",note:"Good distractors are diagnostic; random wrong answers are not.",metrics:[["75","original items"],["5","difficulty bands"],["0","copied items"],["1","answer key per item"]],nodes:[{id:"taxonomy",label:"Item taxonomy",type:"source",x:.12,y:.5},{id:"stem",label:"Prompt stem",type:"system",x:.42,y:.18},{id:"answer",label:"Correct answer",type:"system",x:.42,y:.5},{id:"distractors",label:"Plausible distractors",type:"constraint",x:.42,y:.82},{id:"bank",label:"Question bank",type:"output",x:.82,y:.5}],links:[["taxonomy","stem"],["taxonomy","answer"],["taxonomy","distractors"],["stem","bank"],["answer","bank"],["distractors","bank"]]},
{title:"4. Assemble a progressive 50-question exam",body:"The exam engine samples across categories, increases difficulty over five stages, randomizes answer positions, and preserves the real pressure of forward-only decisions inside a non-pausable 15-minute session.",note:"Difficulty progression matters because late-test items are where pacing strategy becomes decisive.",metrics:[["5","stages"],["50","sampled items"],["15:00","hard clock"],["18 sec","average/item"]],nodes:[{id:"bank",label:"Question bank",type:"source",x:.10,y:.5},{id:"stage1",label:"Foundation",type:"system",x:.34,y:.12},{id:"stage2",label:"Core",type:"system",x:.44,y:.31},{id:"stage3",label:"Applied",type:"system",x:.54,y:.5},{id:"stage4",label:"Advanced",type:"system",x:.64,y:.69},{id:"stage5",label:"Peak",type:"constraint",x:.74,y:.88},{id:"exam",label:"Timed exam",type:"output",x:.88,y:.5}],links:[["bank","stage1"],["stage1","stage2"],["stage2","stage3"],["stage3","stage4"],["stage4","stage5"],["stage5","exam"]]},
{title:"5. Add a feedback loop for deliberate practice",body:"After each run, the app turns raw answers into category accuracy, difficulty performance, pacing signals, missed-question review, and explanations—so practice changes future behavior rather than merely producing a score.",note:"The feedback loop is the difference between a simulator and a training system.",metrics:[["3","category scores"],["5","difficulty scores"],["100%","reviewable"],["local","progress storage"]],nodes:[{id:"exam",label:"Timed exam",type:"source",x:.12,y:.5},{id:"score",label:"Score",type:"system",x:.43,y:.15},{id:"pace",label:"Pacing",type:"system",x:.43,y:.38},{id:"review",label:"Review",type:"system",x:.43,y:.62},{id:"explain",label:"Explanations",type:"system",x:.43,y:.85},{id:"practice",label:"Next practice plan",type:"output",x:.82,y:.5}],links:[["exam","score"],["exam","pace"],["exam","review"],["exam","explain"],["score","practice"],["pace","practice"],["review","practice"],["explain","practice"]]},
{title:"6. QA the mechanics, visuals, and edge cases",body:"The final pass tested build integrity, keyboard behavior, responsive layout, reduced motion, answer randomization, category logic, timer accuracy, and edge cases such as drills containing fewer eligible items than requested.",note:"The result targets high structural fidelity; proprietary psychometric equivalence remains unknowable without Criteria’s calibration data.",metrics:[["0","build errors"],["44 px","touch targets"],["1–5","keyboard answers"],["9/10","structural target"]],nodes:[{id:"app",label:"Practice app",type:"source",x:.12,y:.5},{id:"build",label:"Build QA",type:"system",x:.43,y:.14},{id:"interaction",label:"Interaction QA",type:"system",x:.43,y:.37},{id:"visual",label:"Visual QA",type:"system",x:.43,y:.63},{id:"edge",label:"Edge-case QA",type:"constraint",x:.43,y:.86},{id:"release",label:"Published release",type:"output",x:.83,y:.5}],links:[["app","build"],["app","interaction"],["app","visual"],["app","edge"],["build","release"],["interaction","release"],["visual","release"],["edge","release"]]}
];
const svg=d3.select("#chart");svg.append("title").attr("id","chart-title").text("Animated explainer of how CCAT Sprint was built");const gLinks=svg.append("g"),gNodes=svg.append("g"),gLabels=svg.append("g"),gPulse=svg.append("g");let index=0,timer=null,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;const colors={source:"#8ab4ff",system:"#8ab4ff",constraint:"#ffd37a",output:"#86f0c2"};
function dims(){const box=document.querySelector(".viz").getBoundingClientRect();const mobile=box.width<700;const w=Math.max(360,box.width-28),h=mobile?520:600;svg.attr("viewBox",`0 0 ${w} ${h}`);return{w,h,mobile}}
function pos(d,w,h,mobile){return mobile?{x:d.y*w,y:d.x*h}:{x:d.x*w,y:d.y*h}}
function curve(a,b,w,h,mobile){const p1=pos(a,w,h,mobile),p2=pos(b,w,h,mobile),mx=(p1.x+p2.x)/2;return`M${p1.x},${p1.y} C${mx},${p1.y} ${mx},${p2.y} ${p2.x},${p2.y}`}
function render(sceneIndex,animate=true){index=(sceneIndex+scenes.length)%scenes.length;const scene=scenes[index],{w,h,mobile}=dims(),byId=new Map(scene.nodes.map(d=>[d.id,d]));document.querySelector("#step-label").textContent=`Step ${index+1} of ${scenes.length}`;document.querySelector("#scene-title").textContent=scene.title;document.querySelector("#scene-body").textContent=scene.body;document.querySelector("#scene-note").textContent=scene.note;document.querySelector("#chart-desc").textContent=scene.body+" "+scene.note;document.querySelector("#metrics").innerHTML=scene.metrics.map(d=>`<div class="metric"><strong>${d[0]}</strong><span>${d[1]}</span></div>`).join("");document.querySelectorAll("#timeline button").forEach((b,i)=>b.classList.toggle("active",i===index));
const links=scene.links.map(([s,t],i)=>({id:s+"-"+t,source:byId.get(s),target:byId.get(t),i}));const linkSel=gLinks.selectAll("path").data(links,d=>d.id);linkSel.exit().interrupt().transition().duration(reduced?0:160).style("opacity",0).remove();const linkEnter=linkSel.enter().append("path").attr("fill","none").attr("stroke","#354255").attr("stroke-width",2).attr("vector-effect","non-scaling-stroke").style("opacity",0);const linkMerge=linkEnter.merge(linkSel).interrupt().attr("d",d=>curve(d.source,d.target,w,h,mobile)).attr("stroke-dasharray",function(){return this.getTotalLength?.()||600}).attr("stroke-dashoffset",function(){return this.getTotalLength?.()||600});if(animate&&!reduced){linkMerge.style("opacity",1).transition().delay(d=>d.i*90).duration(560).ease(d3.easeCubicOut).attr("stroke-dashoffset",0)}else linkMerge.style("opacity",1).attr("stroke-dashoffset",0);
const nodeSel=gNodes.selectAll("g.node").data(scene.nodes,d=>d.id);nodeSel.exit().interrupt().transition().duration(reduced?0:160).style("opacity",0).remove();const nodeEnter=nodeSel.enter().append("g").attr("class","node").style("opacity",0);nodeEnter.append("circle").attr("class","core").attr("r",0);nodeEnter.append("circle").attr("class","halo").attr("r",44).attr("fill","none").attr("stroke-width",1);const nodeMerge=nodeEnter.merge(nodeSel).interrupt().attr("transform",d=>{const p=pos(d,w,h,mobile);return`translate(${p.x},${p.y})`});nodeMerge.select(".core").attr("fill",d=>colors[d.type]).attr("stroke","#071018").attr("stroke-width",5);nodeMerge.select(".halo").attr("stroke",d=>colors[d.type]).attr("opacity",.18);if(animate&&!reduced){nodeMerge.transition().delay((d,i)=>150+i*90).duration(380).ease(d3.easeBackOut.overshoot(1.15)).style("opacity",1).select(".core").attr("r",d=>d.type==="output"?28:22)}else nodeMerge.style("opacity",1).select(".core").attr("r",d=>d.type==="output"?28:22);
const labelSel=gLabels.selectAll("text").data(scene.nodes,d=>d.id);labelSel.exit().remove();labelSel.enter().append("text").merge(labelSel).interrupt().attr("x",d=>pos(d,w,h,mobile).x).attr("y",d=>pos(d,w,h,mobile).y+48).attr("text-anchor","middle").attr("fill","#f4f7fb").attr("font-size",d=>mobile?12:(d.type==="output"?16:14)).attr("font-weight",d=>d.type==="output"?800:650).text(d=>d.label).style("opacity",animate&&!reduced?0:1).transition().delay((d,i)=>280+i*90).duration(reduced?0:250).style("opacity",1);
if(animate&&!reduced){const output=scene.nodes.find(d=>d.type==="output");if(output){const p=pos(output,w,h,mobile);gPulse.selectAll("*").remove();gPulse.append("circle").attr("cx",p.x).attr("cy",p.y).attr("r",28).attr("fill","none").attr("stroke",colors.output).attr("stroke-width",2).attr("opacity",.7).transition().delay(760).duration(1050).ease(d3.easeCubicOut).attr("r",70).attr("opacity",0).remove()}}else gPulse.selectAll("*").remove()}
function play(){clearInterval(timer);document.querySelector("#play").textContent="Pause";timer=setInterval(()=>render(index+1,true),4200)}function pause(){clearInterval(timer);timer=null;document.querySelector("#play").textContent="Play"}
document.querySelector("#play").onclick=()=>timer?pause():play();document.querySelector("#prev").onclick=()=>{pause();render(index-1,true)};document.querySelector("#next").onclick=()=>{pause();render(index+1,true)};document.querySelector("#replay").onclick=()=>{pause();render(index,true)};document.querySelector("#motion").onclick=e=>{reduced=!reduced;e.currentTarget.setAttribute("aria-pressed",String(reduced));render(index,false)};window.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.querySelector("#next").click();if(e.key==="ArrowLeft")document.querySelector("#prev").click();if(e.key===" "){e.preventDefault();document.querySelector("#play").click()}});let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(index,false),120)}).observe(document.querySelector(".viz"));d3.select("#timeline").selectAll("button").data(scenes).enter().append("button").attr("aria-label",(d,i)=>`Go to step ${i+1}: ${d.title}`).on("click",(e,d)=>{pause();render(scenes.indexOf(d),true)});render(0,true);
</script>
</body>
</html>
